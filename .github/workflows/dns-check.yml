name: DNS Availability Scan

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip domain scan and inject stub results (for CI testing)"
        type: boolean
        default: false

concurrency:
  group: dns-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        if: inputs.dry_run != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        if: inputs.dry_run != 'true'
        run: pip install -r requirements.txt

      - name: Run domain scan
        if: inputs.dry_run != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python dnsexists.py --field dev

      - name: Copy stub results (dry run)
        if: inputs.dry_run == 'true'
        run: |
          mkdir -p output/
          cp tests/fixtures/available.stub.csv output/available.csv

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Reset bot branch to main
        run: git checkout -B bot/available-domains

      - name: Stage results
        run: git add output/available.csv

      - name: Check for changes
        id: diff
        run: |
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit results
        if: steps.diff.outputs.changed == 'true'
        run: 'git commit -m "chore: update available domains"'

      - name: Push bot branch
        if: steps.diff.outputs.changed == 'true'
        run: git push origin bot/available-domains --force

      - name: Open PR if none exists
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh pr list --head bot/available-domains --base main --state open --json number --jq '.[0].number' | grep -q .; then
            gh pr create \
              --title "chore: update available domains" \
              --body "Automated domain scan results" \
              --base main \
              --head bot/available-domains
          fi

      - name: Merge PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --squash bot/available-domains
